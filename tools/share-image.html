<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Share image · Hoops Playbook</title>
<!--
  The 1200×630 picture link previews show (img/share.png, named in index.html's og:image tag).
  To remake it after changing this page, run npm start, then:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=5000 --screenshot=img/share.png http://localhost:8000/tools/share-image.html
-->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:var(--bg);display:grid;grid-template-columns:1fr 516px;align-items:center;gap:48px;padding:0 56px 0 68px;box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:20px}
  .brand .logo{width:92px;height:92px;font-size:54px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.14)}
  h1{font-size:68px;line-height:.95}
  .lede{margin:26px 0 0;font-size:31px;font-weight:500;line-height:1.25;color:var(--ink)}
  .feats{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
  .feats span{padding:9px 16px;border-radius:999px;background:var(--surface);border:2px solid var(--border);font-size:21px;font-weight:600}
  .feats .hot{background:var(--accent);border-color:var(--accent);color:#fff}
  .frame{background:var(--apron);border-radius:28px;padding:10px;box-shadow:var(--shadow)}
  .frame svg{display:block;width:100%;height:auto;border-radius:20px}
  .pl.has .halo{opacity:1;animation:none}
</style>
<script type="module">
import { resolvePlay } from "../js/playbook.js";
import { renderCourt } from "../js/court.js";
const id = "drive-and-kick", at = 3;  // the play and timeline position drawn on the court
const raw = await (await fetch(`../plays/${id}.json`)).json();
document.getElementById("pic").innerHTML = renderCourt(resolvePlay(raw, id), at, { bubbles: false, label: "Drive and kick" });
</script>
</head>
<body>
  <div>
    <div class="brand"><div class="logo" aria-hidden="true">🏀</div><h1>Hoops<br>Playbook</h1></div>
    <p class="lede">Animated basketball plays that show kids how teammates work together.</p>
    <div class="feats"><span class="hot">▶ Watch it move</span><span>👆 Who’s open?</span></div>
  </div>
  <div class="frame" id="pic"></div>
</body>
</html>
